gtnh.settings.blowdryerTag = 0.2.2
gtnh.modules.gitVersion = false

modName = ViveCraftX
modId = vivecraftx
modGroup = lol.gzmc.vivecraftx
# gitVersion is off, so the version is stated here rather than derived from tags
# (this clone's tags belong to upstream minecrift).
modVersion = 0.1.0
useModGroupForPublishing = false
autoUpdateBuildScript = false

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# No access transformer yet. Where Vivecraft's patches widened access, accessor mixins are used
# instead: the mixin annotation processor resolves member names for us, so nothing has to be
# written out as a hand-looked-up SRG identifier.
accessTransformersFile =

# Mixins live in their own source set, so the annotation processor does not have to run over
# the whole inherited codebase. They can see src/main, not the other way round.
usesMixins = true
separateMixinSourceSet = mixin
mixinsPackage = mixins
usesMixinDebug = false
mixinPlugin =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# JNA finds its own jnidispatch native through the hardcoded com/sun/jna/<platform>/ path on the
# classpath, so it must NOT be relocated. Minimizing would also strip the natives.
usesShadowedDependencies = true
relocateShadowedDependencies = false
minimizeShadowedDependencies = false

includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false

disableSpotless = true
disableCheckstyle = true

org.gradle.jvmargs = -Xmx3g
org.gradle.parallel = true
